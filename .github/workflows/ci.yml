name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Show Prettier output for UI polish
        run: |
          npm run format
          git diff -- apps/web/src/components/AuditTimeline.tsx apps/web/src/components/CaseSummary.tsx apps/web/src/components/ClarificationPanel.tsx apps/web/src/components/ExtractedFieldList.tsx
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - run: npm ci
      - name: Start isolated Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8089 --project=claimflow-test --quiet > /tmp/firestore.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{await fetch("http://127.0.0.1:8089");process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
      - run: npm test -- apps/api/src/firestore.integration.test.ts
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      - if: failure()
        run: cat /tmp/firestore.log

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t claimflow-ci .
      - name: Run packaged app without cloud credentials
        run: |
          docker run -d --name claimflow-ci -p 8080:8080 -e NODE_ENV=development -e UPLOAD_DIR=/tmp/uploads claimflow-ci
          node --input-type=module -e 'for(let i=0;i<30;i++){try{const r=await fetch("http://localhost:8080/health");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          node scripts/smoke.mjs http://localhost:8080
      - if: always()
        run: docker logs claimflow-ci

  deploy:
    name: deploy-cloud-run
    needs: [quality, firestore, container]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claimflow-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: claimflow-ai-agents
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Snapshot voice secret references and inspect previous draft failures
        run: node scripts/verify-voice-release.mjs before "$RUNNER_TEMP/claimflow-voice-refs.json"

      - id: deploy
        name: Build from source and deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: claimflow-ai-agents
          region: australia-southeast1
          service: claimflow-api
          source: .
          env_vars_update_strategy: merge
          env_vars: |-
            NODE_ENV=production
            SERVE_WEB=true
            DATABASE_MODE=firestore
            STORAGE_MODE=gcs
            AI_MODE=vertex
            GEMINI_MODEL=gemini-3.5-flash
            VERTEX_LOCATION=global
            GOOGLE_CLOUD_PROJECT=claimflow-ai-agents
            GOOGLE_CLOUD_LOCATION=australia-southeast1
            FIRESTORE_DATABASE_ID=(default)
            DOCUMENT_BUCKET=claimflow-ai-agents-documents
          flags: >-
            --service-account=claimflow-api-runtime@claimflow-ai-agents.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=1
            --concurrency=4
            --memory=1Gi
            --cpu=1
            --timeout=120
            --port=8080

      - name: Verify public production service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "$SERVICE_URL/health"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "$SERVICE_URL/ready"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "$SERVICE_URL/" > /dev/null
          echo "ClaimFlow deployed: $SERVICE_URL"

      - name: Verify stable URL and preserved voice secret references
        run: node scripts/verify-voice-release.mjs after "$RUNNER_TEMP/claimflow-voice-refs.json"
